  <h1>Maria del Mar Torrente — Digital Entertainment Design Engineer</h1>
  <p>Colombian Digital Entertainment Design Engineer and multidisciplinary artist: rigging, procedural animation, 3D animation, game design, programming and interactive experiences. Producer and visual director of the award-winning animated short Platillo; creator of Regret (1M+ YouTube views, made solo at 17).</p>
  <h2>Highlights</h2><ul><li>Outstanding Student of the Digital Entertainment Design Engineering program (IDED), Universidad Pontificia Bolivariana, 2026.</li><li>"Best DEX Project" won 3 times (2026‑01, 2025‑02, 2024‑02), i.e. her team's project was named the program's best project in three different semesters.</li><li>Platillo (13-min interactive animated mystery, producer & visual director) won three awards in 2026: Best DEX Project, Excellence in Visual Design, Most Original Visual Style.</li><li>Greatest Social / Cultural Impact award (2025-1).</li><li>Regret: 9-minute 2D animated short made entirely solo at 17, 1M+ views on YouTube.</li><li>Builds custom character rigs from scratch (no autorig) with procedural animation, facial systems and custom tools (Blender, Maya, Harmony).</li><li>Leads multidisciplinary teams and production pipelines; comfortable moving between the creative and the technical.</li></ul>
  <h2>Projects</h2><ul><li><b>Platillo</b> — A 13-minute interactive mystery combining animation, puzzle mechanics, character-driven storytelling, and a stylized 3D production pipeline.</li><li><b>StarBlitz</b> — An educational virtual world that teaches children to recognize grooming and unsafe situations by practicing real decisions and seeing their consequences, instead of being given warnings.</li><li><b>Regret</b> — A 9-minute animated short I created independently at 17, taking the project from concept to final delivery, and eventually reaching more than one million views on YouTube.</li><li><b>Crónicas del Tonusco</b> — An approximately 40-minute augmented reality experience in which visitors of the Juan del Corral Museum scan real objects to trigger animated scenes that place them back into their historical and cultural context.</li></ul>
